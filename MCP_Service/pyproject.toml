[project]
name = "mnemosyne-mcp"
version = "0.1.0"
description = "Mnemosyne MCP Server - 跨專案 AI 記憶服務"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "firebase-admin==7.5.0",
    "mcp==2.1.0",
    "google-genai==2.19.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["domain*", "application*", "infrastructure*", "interface*"]
